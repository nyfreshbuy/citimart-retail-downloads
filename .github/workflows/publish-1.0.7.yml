name: Publish store retail 1.0.7
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.0.7.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installer archive
        env:
          ARCHIVE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5a60-81f5-b5ca-ccf501aaa1c7/raw?se=2026-11-05T23%3A17%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=42c35929-4143-462b-a11c-1054e4330e54&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T02%3A21%3A08Z&ske=2026-11-06T02%3A21%3A08Z&sks=b&skv=2026-02-06&sig=qiipr/PcZe1Ns8NudqUeIsqhcAujCpJEG8K9RPcpkUU%3D'
        run: |
          curl --fail --location --silent --show-error "$ARCHIVE_URL" -o installer.zip
          echo '3448312fae46c06396e4fb3fdb4166a589c325e19f44ed5827d346627926049a  installer.zip' | sha256sum -c -
          mkdir installer
          unzip -q installer.zip -d installer
      - name: Publish versioned Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.0.7 installer/* --title 'Citimart Store Retail 1.0.7' --notes 'Malden single A6 quarter sign: move physical print 2 mm left. A7 and other layouts unchanged. Windows tests passed; physical alignment requires a store test print.'
