name: Publish store retail 1.0.6
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.0.6.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installer archive
        env:
          ARCHIVE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1718-81f5-80c1-9d212f321ae4/raw?se=2026-11-05T22%3A26%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=4ba2bd5c-3b7b-4023-8294-2a5713be953e&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T02%3A21%3A10Z&ske=2026-11-06T02%3A21%3A10Z&sks=b&skv=2026-02-06&sig=xzT0bJ5fnulx7xseCUHYQtJFVh9oFHQFMpnLMJcCfFw%3D'
        run: |
          curl --fail --location --silent --show-error "$ARCHIVE_URL" -o installer.zip
          echo 'ea56e01c8a538f9d500101a018057d59b7fa798befa129bb64ac5fa58704c29c  installer.zip' | sha256sum -c -
          mkdir installer
          unzip -q installer.zip -d installer
      - name: Publish versioned Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.0.6 installer/* --title 'Citimart Store Retail 1.0.6' --notes 'Malden single A6/A7 signs: native Windows PDF printing at printable left edge; reject incorrect media sizes before submission. Windows automated tests passed. Physical Canon alignment requires store verification.'
